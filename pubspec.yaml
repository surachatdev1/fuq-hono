name: nwl_secret_login
description: NWL cross-platform employee attendance client.
publish_to: none
version: 1.2.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: 19.5.0
  android_alarm_manager_plus: 4.0.8
  timezone: ^0.10.1
  web: ^1.1.1
  http: ^1.5.0
  http_parser: ^4.1.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  camera: ^0.11.2
  camera_android: ^0.10.10+10
  google_mlkit_face_detection: ^0.13.1
  image: ^4.5.4
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/hono_client_protocol.json
    - assets/brand.png
    - assets/motion/login-hands.png
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/NotoSansThai-Regular.ttf
        - asset: assets/NotoSansThai-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/NotoSans-Regular.ttf
        - asset: assets/NotoSans-Bold.ttf
          weight: 700
