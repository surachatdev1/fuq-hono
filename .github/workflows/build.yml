name: Flutter Android and iOS
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: dart fix --apply
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-UI-captures
          path: test/captures/*.png
      - name: Keep the Android test signing identity stable
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: nwl-flutter-debug-signing-v2
      - name: Prepare dedicated test signing key
        run: |
          mkdir -p .ci
          if [ ! -f .ci/debug.keystore ]; then
            keytool -genkeypair -keystore .ci/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=NWL Flutter Test, O=NWL, C=TH" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: NWL-Flutter-1.0.0-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: NWL-Flutter-1.0.0-Android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NWL-Flutter-Test-Signing-PRIVATE
          path: .ci/debug.keystore
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Flutter-formatted-source-lock
          path: |
            lib/
            test/*.dart
            pubspec.lock
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - name: Compile unsigned iOS device app
        run: |
          flutter build ios --release --no-codesign --verbose > ios-build.log 2>&1 || { tail -n 160 ios-build.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-build-diagnostics
          path: ios-build.log
      - run: cd build/ios/iphoneos && ditto -c -k --keepParent Runner.app NWL-Flutter-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NWL-Flutter-1.0.0-iOS-unsigned
          path: build/ios/iphoneos/NWL-Flutter-iOS-unsigned.zip

  android-native:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NWL-Flutter-1.0.0-Android-debug
          path: native-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: python3 scripts/native-cold-start.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-native-launch
          path: native-captures/
