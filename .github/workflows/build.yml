name: Flutter Android and iOS
on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --update-goldens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Flutter-UI-captures
          path: test/captures/*.png
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: NWL-Flutter-1.0.0-Android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Flutter-formatted-source-lock
          path: |
            lib/
            test/*.dart
            pubspec.lock
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && ditto -c -k --keepParent Runner.app NWL-Flutter-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NWL-Flutter-1.0.0-iOS-unsigned
          path: build/ios/iphoneos/NWL-Flutter-iOS-unsigned.zip
