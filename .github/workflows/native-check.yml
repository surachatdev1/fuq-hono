name: Verify final Flutter APK startup
on:
  push:
    paths: ['.github/workflows/native-check.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact delivery APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p native-apk
          for attempt in $(seq 1 15); do
            if gh run download 42307055019 --name NWL-Flutter-1.0.0-Android-debug --dir native-apk; then exit 0; fi
            sleep 20
          done
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: python3 scripts/native-cold-start.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verified-final-Android-cold-start
          path: native-captures/
